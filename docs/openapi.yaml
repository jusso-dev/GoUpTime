openapi: 3.0.3
info:
  title: UpTime API
  version: dev
  description: Self-hosted uptime and synthetic monitoring API.
servers:
  - url: http://localhost:8008
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Health status
  /health-check:
    get:
      security: []
      responses:
        "200":
          description: Backwards-compatible health status
  /ping-endpoint:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          description: Manual HTTP check result
  /api/v1/check:
    post:
      summary: Run an ad-hoc check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorInput"
      responses:
        "200":
          description: Check result
  /api/v1/monitors:
    get:
      summary: List monitors
      parameters:
        - name: tag
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [up, down, degraded] }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Monitor list
    post:
      summary: Create monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorInput"
      responses:
        "201":
          description: Created monitor
  /api/v1/monitors/{id}:
    get:
      summary: Get monitor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Monitor
    put:
      summary: Update monitor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated monitor
    delete:
      summary: Delete monitor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted
  /api/v1/monitors/{id}/check-now:
    post:
      summary: Run a stored monitor immediately
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Check result
  /api/v1/monitors/{id}/results:
    get:
      summary: List monitor results
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Check results
  /api/v1/check-results:
    get:
      summary: List check results
      parameters:
        - name: monitorId
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: statusPageId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [up, down, degraded] }
        - name: excludeMaintenance
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Check results
  /api/v1/incidents:
    get:
      summary: List incidents
      responses:
        "200":
          description: Incident list
  /api/v1/incidents/{id}:
    get:
      summary: Get incident
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Incident
  /api/v1/incidents/{id}/resolve:
    post:
      summary: Resolve incident
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Resolved incident
  /api/v1/stats/overview:
    get:
      summary: Overview stats
      responses:
        "200":
          description: Overview stats
  /api/v1/notification-channels:
    get:
      summary: List notification channels
      responses:
        "200":
          description: Channels
    post:
      summary: Create notification channel
      responses:
        "201":
          description: Created channel
  /api/v1/api-keys:
    get:
      summary: List API keys
      responses:
        "200":
          description: API keys without raw key values
    post:
      summary: Create API key
      responses:
        "201":
          description: Created key with one-time raw value
  /api/v1/services:
    get:
      summary: List services
      responses:
        "200": { description: Service list }
    post:
      summary: Create service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Service" }
      responses:
        "201": { description: Created service }
  /api/v1/tags:
    get:
      summary: List tags
      responses:
        "200": { description: Tag list }
  /api/v1/maintenance-windows:
    get:
      summary: List maintenance windows
      responses:
        "200": { description: Maintenance windows }
    post:
      summary: Create maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceWindow" }
      responses:
        "201": { description: Created maintenance window }
  /api/v1/status-pages:
    get:
      summary: List status pages
      responses:
        "200": { description: Status pages }
    post:
      summary: Create status page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPage" }
      responses:
        "201": { description: Created status page }
  /api/v1/status-pages/{id}/components:
    get:
      summary: List status page components
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Components }
    post:
      summary: Create status page component
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageComponent" }
      responses:
        "201": { description: Created component }
  /api/v1/reports/uptime:
    get:
      summary: Uptime report
      parameters:
        - name: monitorId
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: statusPageId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Uptime report }
  /api/v1/exports/check-results:
    get:
      summary: Export check results
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200": { description: Check result export }
  /api/v1/exports/incidents:
    get:
      summary: Export incidents
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200": { description: Incident export }
  /status/{slug}:
    get:
      security: []
      summary: Render public status page
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Public status page HTML }
  /status/{slug}/json:
    get:
      security: []
      summary: Public status page JSON
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Public status page JSON }
  /heartbeat/{token}:
    get:
      security: []
      summary: Record a heartbeat
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Heartbeat recorded }
    post:
      security: []
      summary: Record a heartbeat with metadata
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Heartbeat recorded }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    MonitorInput:
      type: object
      required: [name, type, target]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, api, tcp, udp, dns, tls, keyword, domain, ping, heartbeat] }
        target: { type: string }
        method: { type: string, example: GET }
        expectedStatus: { type: integer, example: 200 }
        expectedKeyword: { type: string }
        timeoutSeconds: { type: integer, example: 10 }
        intervalSeconds: { type: integer, example: 60 }
        failureThreshold: { type: integer, example: 3 }
        enabled: { type: boolean }
        serviceId: { type: string }
        tags:
          type: array
          items: { type: string }
        config:
          type: object
    Service:
      type: object
      required: [name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
    MaintenanceWindow:
      type: object
      required: [name, startsAt, endsAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, example: UTC }
        recurrence: { type: string, enum: [none, daily, weekly, monthly] }
        enabled: { type: boolean }
        monitorIds:
          type: array
          items: { type: string }
        tagNames:
          type: array
          items: { type: string }
    StatusPage:
      type: object
      required: [name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        primaryColor: { type: string }
        public: { type: boolean }
        noIndex: { type: boolean }
    StatusPageComponent:
      type: object
      required: [name]
      properties:
        id: { type: string }
        statusPageId: { type: string }
        name: { type: string }
        description: { type: string }
        serviceId: { type: string }
        manualStatus: { type: string, enum: [up, down, degraded] }
        orderIndex: { type: integer }
        monitorIds:
          type: array
          items: { type: string }
